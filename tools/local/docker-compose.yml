services:
  nginx:
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    #      - "443:443"
    volumes:
      - ./nginx:/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
