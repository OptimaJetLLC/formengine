<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FormEngine bundle embedding example</title>
  <script src="./dist/index.iife.js" async defer></script>
</head>
<body style="margin: 0">
<div id="designer"></div>

<script type="text/javascript">
  window.onload = function () {
    const {
      renderFormBuilder,
      createBuilderView,
      rSuiteComponents,
      richTextComponent,
      signatureComponent,
      fastQrComponent,
      googleMapComponent
    } = window.FormEngineDesignerBundle

    const {
      ltrCssLoader,
      rsErrorMessage,
      RsLocalizationWrapper,
      rsTooltip,
      rtlCssLoader
    } = rSuiteComponents

    const filteredRSuiteComponents = rSuiteComponents.rSuiteComponents.filter(component => {
      return component.data.typeName !== 'RsTimePicker'
    })

    const myComponentsSet = [
      ...filteredRSuiteComponents,
      richTextComponent.richTextComponent,
      //signatureComponent.signatureComponent,
      fastQrComponent.fastQrComponent,
      googleMapComponent.googleMapComponent
    ].map(component => component.build())

    const view = createBuilderView(myComponentsSet)
      .withViewerWrapper(RsLocalizationWrapper)
      .withCssLoader('ltr', ltrCssLoader)
      .withCssLoader('rtl', rtlCssLoader)

    window.designerRoot = renderFormBuilder('designer', {
      getForm: () => form,
      view
    })
  }
  const form = `
{
  "version": "1",
  "form": {
    "key": "Screen",
    "type": "Screen",
    "props": {},
    "children": [
      {
        "key": "RsInput",
        "type": "RsInput",
        "props": {}
      },
      {
        "key": "RsTimePicker",
        "type": "RsTimePicker",
        "props": {}
      },
      {
        "key": "RsSignature",
        "type": "RsSignature",
        "props": {}
      },
      {
        "key": "RichTextEditor",
        "type": "RichTextEditor",
        "props": {}
      },
      {
        "key": "FastQR",
        "type": "FastQR",
        "props": {}
      },
      {
        "key": "GoogleMap",
        "type": "GoogleMap",
        "props": {}
      }
    ]
  },
  "localization": {},
  "languages": [
    {
      "code": "en",
      "dialect": "US",
      "name": "English",
      "description": "American English",
      "bidi": "ltr"
    }
  ],
  "defaultLanguage": "en-US"
}
`
</script>
</body>
</html>
