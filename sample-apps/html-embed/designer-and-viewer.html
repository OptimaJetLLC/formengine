<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FormEngine Designer bundle embedding example</title>
</head>
<body style="margin: 0">

<script type="text/javascript">
  function createActionDefinition(bundle) {
    const {ActionDefinition} = bundle
    if (!ActionDefinition) throw new Error('No action definition found in the bundle');

    return ActionDefinition.functionalAction((e, args) => {
      console.log(e, args)
    }, {
      p1: 'string',
      p2: 'boolean',
      p3: 'number'
    })
  }

  function elementOnLoad(htmlElement, callback) {
    function onLoad() {
      htmlElement.removeEventListener('load', onLoad);
      callback?.();
    }

    htmlElement.addEventListener('load', onLoad);
  }

  function whenScriptLoaded(scriptId, scriptUrl, callback) {
    if (!window._dynamicScripts) window._dynamicScripts = {};

    if (window._dynamicScripts[scriptId] === true) {
      callback?.();
      return;
    }

    const htmlElement = document.getElementById(scriptId);
    if (htmlElement) {
      elementOnLoad(htmlElement, () => callback?.());
      return;
    }

    const scriptTag = document.createElement('script');
    scriptTag.id = scriptId;
    scriptTag.src = scriptUrl;
    scriptTag.async = true;
    scriptTag.defer = true;

    elementOnLoad(scriptTag, () => {
      window._dynamicScripts[scriptId] = true;
      callback?.();
    });

    const head = document.head || document.getElementsByTagName('head')[0];
    head.insertBefore(scriptTag, head.firstChild);
  }

  function doRemove() {
    window.viewerRoot?.unmount()
    delete window.reactRoot

    window.designerRoot?.unmount()
    delete window.designerRoot
  }

  function doRender(useUmdModule) {
    doRemove()

    const form = `
{
  "version": "1",
  "tooltipType": "RsTooltip",
  "errorType": "RsErrorMessage",
  "form": {
    "key": "Screen",
    "type": "Screen",
    "props": {},
    "children": [
      {
        "key": "name",
        "type": "RsInput",
        "props": {
          "placeholder": {
            "value": "Enter your name"
          },
          "label": {
            "value": "Name"
          }
        },
        "schema": {
          "validations": [
            {
              "key": "required"
            }
          ]
        },
        "tooltipProps": {
          "text": {
            "value": "Name"
          }
        }
      },
      {
        "key": "password",
        "type": "RsInput",
        "props": {
          "label": {
            "value": "Password"
          },
          "passwordMask": {
            "value": true
          }
        },
        "schema": {
          "validations": [
            {
              "key": "required"
            }
          ]
        },
        "tooltipProps": {
          "text": {
            "value": "Password"
          },
          "placement": {
            "value": "left"
          }
        }
      },
      {
        "key": "submit",
        "type": "RsButton",
        "props": {
          "children": {
            "value": "Login"
          },
          "color": {
            "value": "blue"
          },
          "appearance": {
            "value": "primary"
          }
        }
      }
    ]
  },
  "localization": {},
  "languages": [
    {
      "code": "en",
      "dialect": "US",
      "name": "English",
      "description": "American English",
      "bidi": "ltr"
    }
  ],
  "defaultLanguage": "en-US"
}
`

    const moduleName = useUmdModule === true ? 'index.umd.js' : 'index.iife.js'

    whenScriptLoaded('designer-script', `../../src/packages/designer-bundle/dist/${moduleName}`, () => {
      const bundle = window.FormEngineDesignerBundle;
      const props = {
        getForm: () => form,
        actions: {
          assertArgs: createActionDefinition(bundle)
        }
      }

      window.designerRoot = bundle.renderFormBuilder('root', props)

      whenScriptLoaded('viewer-script', `../../src/packages/viewer-bundle/dist/${moduleName}`, () => {
        const bundle = window.FormEngineViewerBundle;
        const props = {
          getForm: () => form,
          actions: {
            assertArgs: createActionDefinition(bundle)
          }
        }

        window.viewerRoot = bundle.renderFormViewer('root2', props)
      })

    })
  }
</script>
<button onclick="doRender(true)">Render UMD</button>
<button onclick="doRender(false)">Render IIFE</button>
<button onclick="doRemove()">Remove</button>

<div id="root"></div>
<div id="root2"></div>

</body>
</html>
