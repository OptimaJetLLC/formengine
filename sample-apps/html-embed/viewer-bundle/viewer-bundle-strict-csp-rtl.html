<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FormEngine bundle embedding example (Strict RTL)</title>
  <link rel="stylesheet" href="../../../src/packages/viewer-bundle/dist/viewer-bundle-rtl.css">
  <script src="./viewer-bundle-form.js"></script>
  <script src="../../../src/packages/viewer-bundle/dist/index.iife.js" async defer></script>

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
           script-src 'self' 'unsafe-eval';
           script-src-elem 'self' 'unsafe-inline';
           style-src 'unsafe-inline' file:;
           img-src 'self' data:;
           font-src 'self';
           object-src 'none';
           base-uri 'self';
           form-action 'self';">

</head>
<body style="margin: 20px">
<div id="viewer"></div>

<script type="text/javascript">
  window.onload = function () {
    const {renderFormViewer, rSuiteComponents, createView} = window.FormEngineViewerBundle;
    const view = createView(rSuiteComponents.models)

    const props = {
      language: 'ar-EG',
      view,
      getForm: () => window.viewerBundleForm,
      actions: {
        onSubmit: (e) => {
          // submit the form to the backend
          alert('Form data: ' + JSON.stringify(e.data))
        }
      }
    }

    window.viewerRoot = renderFormViewer('viewer', props)
  }
</script>
</body>
</html>
