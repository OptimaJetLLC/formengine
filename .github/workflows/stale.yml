name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: [self-hosted]
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 456
          days-before-issue-close: 30
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: possibly close
          exempt-issue-labels: 'devops,enhancement,feature,theme request,help wanted,p1,bug'
          stale-issue-message: >
            This issue has been automatically marked as possibly close because it has not had
            recent activity. It will be closed if no further activity occurs. Please
            leave a comment if this is still an issue for you. Thank you.
          close-issue-message: >
            This issue was closed because of lack of recent activity. Reopen if you still need assistance.
          close-issue-reason: not_planned
