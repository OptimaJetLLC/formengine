name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Tests
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Tests
        run: earthly --ci +npm-test

  build:
    name: Build Packages
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Build
        run: earthly --ci +npm-build

  check-circular-deps:
    name: Check circular dependencies
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Check
        run: earthly --ci +npm-check-circular-deps

  check-wrong-imports:
    name: Check wrong imports
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Check
        run: earthly --ci +npm-check-wrong-imports

  eslint:
    name: ESLint
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run ESLint
        run: earthly --ci +npm-eslint

  unused-exports:
    name: Check unused exports
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run check unused exports
        run: earthly --ci +npm-check-unused-exports

  type-check:
    name: Perform a type check
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Perform a type check
        run: earthly --ci +npm-check-tsc

  bundle:
    name: Bundle packages
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Bundle
        run: earthly --ci +npm-bundle
