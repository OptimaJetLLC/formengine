name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run e2e Tests
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Check installed browsers
        working-directory: src
        shell: pwsh
        run: |
          Write-Host "Checking if Chrome is installed..."
          $CmdOutput = npx playwright install --with-deps --only-shell --dry-run chrome `
            | Where-Object { $_ -match 'browser: chrome' } `
            | ForEach-Object { $_.Trim() } `

          if ($CmdOutput -ilike 'browser: chrome')
          {
            echo "PLAYWRIGHT_CHROME_INSTALLED=true" >> $Env:GITHUB_ENV
            Write-Host "Chrome is installed."
            Write-Host $Env:GITHUB_ENV
          }
          else
          {
            Write-Host "Chrome is not installed."
          }

      - name: Install playwright browsers
        run: npx playwright install --with-deps --only-shell chrome
        working-directory: src
        if: env.PLAYWRIGHT_CHROME_INSTALLED!='true'

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: src

      - name: Run components tests
        run: npm run test:browser
        working-directory: src

      #      - name: Upload Playwright Report
      #        uses: actions/upload-artifact@v4
      #        if: ${{ !cancelled() }}
      #        with:
      #          name: playwright-report
      #          path: tests/e2e/playwright-report/
      #          retention-days: 10

      - name: Generate Report
        run: npx github-actions-ctrf reports/ctrf/ctrf-report.json
        working-directory: src/tests/e2e
        if: always()

  tests:
    name: Run Tests
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Tests
        run: earthly +npm-test

  #      - name: Upload test results
  #        uses: actions/upload-artifact@v4
  #        if: always()
  #        with:
  #          name: test-results
  #          path: test-results

  build:
    name: Build Packages
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Build
        run: earthly --ci +npm-build

  check-circular-deps:
    name: Check circular dependencies
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Check
        run: earthly --ci +npm-check-circular-deps

  check-wrong-imports:
    name: Check wrong imports
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Check
        run: earthly --ci +npm-check-wrong-imports

  eslint:
    name: ESLint
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run ESLint
        run: earthly --ci +npm-eslint

  unused-exports:
    name: Check unused exports
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run check unused exports
        run: earthly --ci +npm-check-unused-exports

  type-check:
    name: Perform a type check
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Perform a type check
        run: earthly --ci +npm-check-tsc

  bundle:
    name: Bundle packages
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Bundle
        run: earthly --ci +npm-bundle

  documentation:
    name: Build documentation
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Bundle
        run: earthly --ci +npm-documentation-build
