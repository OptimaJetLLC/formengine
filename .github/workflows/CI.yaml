name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run e2e Tests
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Install dependencies
        run: npm ci

      - name: Check installed browsers
        run: |
          echo "Checking if Chrome is available..."
          dry_run="$(npx playwright install --only-shell --dry-run chrome 2>&1 || true)"
          printf '%s\n' "$dry_run"
          if printf '%s\n' "$dry_run" | grep -qE 'Install location:[[:space:]]+<system>|already installed on the system'; then
            echo "PLAYWRIGHT_CHROME_INSTALLED=true" >> "$GITHUB_ENV"
            echo "Chrome is already available on the system."
          else
            echo "Chrome is not installed."
          fi

      - name: Install playwright browsers
        run: npx playwright install --only-shell chrome
        if: env.PLAYWRIGHT_CHROME_INSTALLED != 'true'

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Update playwright
        run: npx playwright install

      - name: Run components tests
        run: npm run test:browser

      #      - name: Upload Playwright Report
      #        uses: actions/upload-artifact@v4
      #        if: ${{ !cancelled() }}
      #        with:
      #          name: playwright-report
      #          path: tests/e2e/playwright-report/
      #          retention-days: 10

      - name: Generate Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'tests/e2e/reports/ctrf/ctrf-report.json'
          github-report: true
        if: always()

  tests:
    name: Run Tests
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Tests
        run: earthly --ci +npm-test

  #      - name: Upload test results
  #        uses: actions/upload-artifact@v4
  #        if: always()
  #        with:
  #          name: test-results
  #          path: test-results

  build:
    name: Build Packages
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Build
        run: earthly --ci +npm-build

  checks:
    name: Static checks
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Check
        run: earthly --ci +npm-check-all

  bundle:
    name: Bundle packages
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Bundle
        run: earthly --ci +npm-bundle

  documentation:
    name: Build documentation
    runs-on: [ self-hosted, earthly ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Bundle
        run: earthly --ci +npm-documentation-build
