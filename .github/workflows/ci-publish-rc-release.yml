name: CI publish RC release

on:
  workflow_call:
    secrets:
      FORMENGINE_GH_TOKEN:
        required: true

jobs:
  publish-rc-release:
    name: Publish RC draft release
    runs-on: [self-hosted]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Clean stale archives directory
        run: rm -rf .archives
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: .archives
      - name: Download documentation archive
        uses: actions/download-artifact@v8
        with:
          name: documentation-archive
          path: .archives
      - name: Download designer guide archive
        uses: actions/download-artifact@v8
        with:
          name: designer-guide-archive
          path: .archives
      - name: Validate downloaded archives
        run: earthly --ci +validate-rc-archives
      - name: Publish draft GitHub release on OptimaJetLLC/formengine
        env:
          # Prefer a PAT with contents:write when the caller workflow lacks release write on this repo.
          GH_TOKEN: ${{ secrets.FORMENGINE_GH_TOKEN }}
        run: |
          test -n "${GH_TOKEN}" || {
            echo "Missing secret FORMENGINE_GH_TOKEN (PAT with contents:write on OptimaJetLLC/formengine)" >&2
            exit 1
          }
          earthly --ci --secret GH_TOKEN +npm-publish-rc-release \
            --REPO_SLUG=OptimaJetLLC/formengine \
            --GITHUB_SHA=master
