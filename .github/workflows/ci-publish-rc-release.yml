name: CI publish RC release

on:
  workflow_call:

jobs:
  publish-rc-release:
    name: Publish RC draft release
    runs-on: [self-hosted]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Clean stale archives directory
        run: rm -rf .archives
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: .archives
      - name: Download documentation archive
        uses: actions/download-artifact@v8
        with:
          name: documentation-archive
          path: .archives
      - name: Download designer guide archive
        uses: actions/download-artifact@v8
        with:
          name: designer-guide-archive
          path: .archives
      - name: Validate downloaded archives
        run: earthly --ci +validate-rc-archives
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${{ github.repository }}"
          test -n "${{ github.sha }}"
          earthly --ci --secret GH_TOKEN +npm-publish-rc-release \
            --REPO_SLUG="${{ github.repository }}" \
            --GITHUB_SHA="${{ github.sha }}"
