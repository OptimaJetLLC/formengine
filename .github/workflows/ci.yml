name: Check, build, draft

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Run static checks in Docker
        run: earthly --ci +npm-check-all

  tests:
    needs: checks
    uses: ./.github/workflows/ci-tests.yml
    secrets:
      FORMENGINE_TEST_LICENSE_KEY: ${{ secrets.FORMENGINE_TEST_LICENSE_KEY }}
      FORMENGINE_TEST_LICENSE_KEYS_JSON: ${{ secrets.FORMENGINE_TEST_LICENSE_KEYS_JSON }}
      FORMENGINE_FORMS_WITH_VERSIONS_LICENSE_KEY: ${{ secrets.FORMENGINE_FORMS_WITH_VERSIONS_LICENSE_KEY }}

  e2e:
    needs: checks
    uses: ./.github/workflows/ci-e2e.yml
    secrets:
      FORMENGINE_TEST_LICENSE_KEY: ${{ secrets.FORMENGINE_TEST_LICENSE_KEY }}
      FORMENGINE_TEST_LICENSE_KEYS_JSON: ${{ secrets.FORMENGINE_TEST_LICENSE_KEYS_JSON }}
      FORMENGINE_FORMS_WITH_VERSIONS_LICENSE_KEY: ${{ secrets.FORMENGINE_FORMS_WITH_VERSIONS_LICENSE_KEY }}

  bundle:
    needs:
      - tests
      - e2e
    uses: ./.github/workflows/ci-bundle.yml

  build-documentation:
    needs:
      - tests
      - e2e
    uses: ./.github/workflows/ci-build-documentation.yml

  build-apps-and-views:
    needs: checks
    uses: ./.github/workflows/ci-build-apps-and-views.yml

  publish-rc-release:
    needs:
      - bundle
      - build-documentation
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/rc/') }}
    uses: ./.github/workflows/ci-publish-rc-release.yml
    secrets:
      FORMENGINE_GH_TOKEN: ${{ secrets.FORMENGINE_GH_TOKEN }}
