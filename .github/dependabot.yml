version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/**
    schedule:
      interval: weekly
      day: monday
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        versions: ["<19.0.0"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        versions: ["<19.0.0"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-is"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rsuite"
        update-types: ["version-update:semver-major"]
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
      major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
      security-patch:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - patch
      security-minor:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
      security-major:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 5
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
      major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
      security-patch:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - patch
      security-minor:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
      security-major:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - major
