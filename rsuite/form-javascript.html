<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Form Pure JS | OptimaJet</title>
    <link rel="Shortcut Icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <script src="/scripts/jquery.js" type="text/javascript"></script>
    <script src="/build/optimajet-formbuilder-javascript.js" type="text/javascript"></script>

    <link href="/css/semantic.min.css" rel="stylesheet" type="text/css" />
    <link href="/css/optimajet-formbuilder.css" rel="stylesheet" type="text/css" />
    
    <div style="margin: 20px">
        <a href="/"><img src="/images/logo.svg"/></a>
    </div>
    <div id="container" class="container" style="margin: 10px"></div>
    <script>
        function getFormFunc(formname)
        {
            var formurl = formname + ".json";
            var source = $.ajax({
                url: formurl,
                async: false,
            }).responseJSON;
            return source;
        }

        var getAdditionalDataForControl = function(){
            console.log(args);
        };

        var eventFunc = function (args){
            console.log(args);
        }

        var settings = {
            container: document.getElementById("container"),
            getFormFunc: getFormFunc,
            getAdditionalDataForControl: getAdditionalDataForControl,
            eventFunc: eventFunc,
            downloadUrl: "/download.html?file=",
            uploadUrl: "/upload.html?file="
        };
    
        var data = {
            title: 'Test application',
            type: 2,
            comment: 'This is a test application for John Doe'
        };

        settings.onChange = function(form, changeSet){
             var name = changeSet.name;
             var value = changeSet.value;
             data[name] = value;
        };

        settings.onInit = function(initData){
            for(var field in initData){
                if(!data[field]){
                    data[field] = initData[field];
                }
            }
        };

        //window.OptimaJetFormBuilderLicense("<your license key");
        
        var form = new OptimaJetForm(settings);   
        form.load('./samples/forms/application-form');
        form.setData(data);
    </script>
</body>
</html>
