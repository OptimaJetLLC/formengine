<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Aurora / Mesh Gradients -->
    <radialGradient id="aurora1" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#ffffff" fill-opacity="0.15"/>
    </pattern>

    <!-- Fade Mask for Grid -->
    <mask id="fadeMask">
      <rect width="1200" height="630" fill="url(#fadeGradient)"/>
    </mask>
    <radialGradient id="fadeGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="#09090b"/>

  <!-- Aurora Effects -->
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>
  <rect width="1200" height="630" fill="url(#aurora3)"/>

  <!-- Dot Grid with Fade -->
  <rect width="1200" height="630" fill="url(#dotGrid)" mask="url(#fadeMask)"/>

  <!-- Decorative Sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    <path d="M150 120 L153 135 L168 138 L153 141 L150 156 L147 141 L132 138 L147 135 Z" />
    <path d="M1020 480 L1022 490 L1032 492 L1022 494 L1020 504 L1018 494 L1008 492 L1018 490 Z" fill="#f472b6"/>
  </g>

  <!-- Modern Abstract Icon (Glassmorphism) -->
  <g transform="translate(100, 160)">
    <!-- Back glow -->
    <rect x="-15" y="-15" width="110" height="110" rx="28" fill="#7c3aed" fill-opacity="0.3" filter="url(#glow)"/>
    <!-- Main glass panel -->
    <rect x="0" y="0" width="80" height="80" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <!-- Inner elements -->
    <rect x="20" y="20" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="20" y="34" width="28" height="6" rx="3" fill="#f472b6" fill-opacity="0.9"/>
    <rect x="20" y="48" width="36" height="6" rx="3" fill="#ffffff" fill-opacity="0.4"/>
    <!-- Decorative glowing dot -->
    <circle cx="62" cy="62" r="7" fill="#06b6d4" filter="url(#glow)"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(100, 320)">
    <!-- Badge -->
    <rect x="0" y="-50" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="85" y="-26" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="1.5">DESIGNER GUIDE</text>

    <!-- Title -->
    <text x="0" y="50" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="84" font-weight="800" fill="url(#textGrad)" letter-spacing="-3">
      FormEngine
    </text>

    <!-- Subtitle -->
    <text x="0" y="105" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="400" fill="#a1a1aa" letter-spacing="0.5">
      Build forms without code
    </text>

    <!-- URL / CTA Pill -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="240" height="48" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="24" y="30" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ffffff">learn.formengine.io</text>
      <!-- Arrow -->
      <path d="M190 24 L208 24 M200 16 L208 24 L200 32" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Right side decorative abstract geometry -->
  <g transform="translate(880, 180)" opacity="0.6">
    <!-- Rotated rounded square -->
    <rect x="20" y="20" width="140" height="140" rx="36" fill="none" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5" transform="rotate(12 90 90)"/>
    <rect x="40" y="40" width="100" height="100" rx="24" fill="none" stroke="#f472b6" stroke-opacity="0.2" stroke-width="1" transform="rotate(-8 90 90)"/>
    <!-- Glowing orb -->
    <circle cx="90" cy="90" r="40" fill="url(#aurora2)" filter="url(#glow)"/>
  </g>
</svg>
